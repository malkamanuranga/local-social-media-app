{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow border-0 rounded-4">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <i class="bi bi-person-plus-fill text-success" style="font-size: 3rem;"></i>
                    <h3 class="fw-bold mt-2">Create Account</h3>
                    <p class="text-muted small">Join LocalSocial today</p>
                </div>
                
                <form method="POST" action="{{ url_for('signup') }}">
                    <div class="mb-3">
                        <label class="form-label fw-bold small">Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                            <input type="text" name="username" class="form-control" placeholder="Choose a username" required autofocus>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label fw-bold small">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                            <input type="password" name="password" class="form-control" placeholder="Create a password" required>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-success w-100 py-2 fw-bold rounded-3">Sign Up</button>
                </form>
                
                <hr class="my-4">
                
                <div class="text-center">
                    <p class="mb-0 text-muted">Already have an account?</p>
                    <a href="{{ url_for('login') }}" class="text-decoration-none fw-bold">Log in here</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
